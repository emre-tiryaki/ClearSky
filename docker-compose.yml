services:
    rabbitmq:
        image: rabbitmq:3-management
        container_name: clearsky-rabbitmq
        env_file:
            - ./.env
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
        ports:
            - "${RABBITMQ_PORT}:5672"
            - "${RABBITMQ_MANAGEMENT_PORT}:15672"
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    mongodb:
        image: mongo:7
        container_name: clearsky-mongodb
        env_file:
            - ./.env
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
        ports:
            - "${MONGO_PORT}:27017"
        volumes:
            - mongodb_data:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
            interval: 10s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    device-interface:
        dns:
            - 8.8.8.8
            - 8.8.4.4
        build:
            context: .
            dockerfile: services/device-interface/Dockerfile
        container_name: clearsky-device-interface
        environment:
            OPENSKY_BASE_URL: ${OPENSKY_BASE_URL}
            POLL_INTERVAL_MS: ${POLL_INTERVAL_MS}
            OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID}
            OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET}
            RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
            RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
        depends_on:
            rabbitmq:
                condition: service_healthy
        restart: unless-stopped

    api-gateway:
        build:
            context: .
            dockerfile: services/api-gateway/Dockerfile
        container_name: clearsky-api-gateway
        environment:
            PORT: ${PORT}
            RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
            RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
            RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
            RABBITMQ_ROUTING_PATTERN: ${RABBITMQ_ROUTING_PATTERN}
            RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH}
            RABBITMQ_STATUS_QUEUE: ${RABBITMQ_STATUS_QUEUE}
            RABBITMQ_STATUS_ROUTING_PATTERN: ${RABBITMQ_STATUS_ROUTING_PATTERN}
            GRAPHIQL_ENABLED: ${GRAPHIQL_ENABLED}
            MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017
            MONGODB_DB_NAME: ${MONGODB_DB_NAME}
        ports:
            - "${API_GATEWAY_PORT}:4000"
        depends_on:
            rabbitmq:
                condition: service_healthy
            mongodb:
                condition: service_healthy
        restart: unless-stopped

    frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile
            args:
                VITE_GRAPHQL_WS_URL: ${VITE_GRAPHQL_WS_URL}
                VITE_GRAPHQL_HTTP_URL: ${VITE_GRAPHQL_HTTP_URL}
        container_name: clearsky-frontend
        ports:
            - "${FRONTEND_PORT}:80"
        depends_on:
            - api-gateway
        restart: unless-stopped

volumes:
    rabbitmq_data:
    mongodb_data:
